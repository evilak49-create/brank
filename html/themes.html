<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CASH CLUB · 首页配色选型</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{color-scheme:dark;--base:#101012;--panel:#17171a;--line:#2f2e32;--ink:#f5f2ed;--muted:#b9b3b5;--accent:#ffc18a}
body{background:var(--base);color:var(--ink);margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
.shell{width:min(100%,1040px);margin:auto;padding:22px 19px 28px}
header{margin-bottom:18px}
.wordmark{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.14em}
h1,h2,p{margin:0}
h1{margin-top:6px;font-size:clamp(24px,5vw,37px);letter-spacing:-.03em;line-height:1.18}
header p{margin-top:8px;color:var(--muted);font-size:13px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(335px,420px);gap:18px;align-items:start}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:10px;font-weight:750}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.option{position:relative;min-width:0;display:flex;align-items:center;gap:9px;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:56px;cursor:pointer}
.option:hover{border-color:#7c6658}
.option:has(:checked){background:#27201d;border-color:var(--accent)}
.option:has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.option .number{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.option strong{display:block;font-size:13px;line-height:1.2}
.mini{display:flex;gap:3px;margin-top:5px}
.mini span{width:10px;height:10px;border-radius:2px;border:1px solid #ffffff26}
.preview{min-width:0;display:grid;gap:8px}
.preview-meta{min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.preview h2{font-size:17px;line-height:1.25}
.open{
  flex:none;display:inline-flex;align-items:center;min-height:36px;padding:5px 9px;border:1px solid #694934;
  border-radius:8px;color:var(--accent);font-weight:700;text-decoration:none;font-size:12px
}
.open:hover{background:#36261e}
.open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#description{color:var(--muted);font-size:12px}
.phone{padding:3px;border:1px solid #4c4545;background:#252326;border-radius:19px;overflow:hidden}
iframe{display:block;width:100%;height:clamp(560px,74dvh,810px);border:0;border-radius:15px;background:#101012}
@media(max-width:700px){
  .shell{padding:14px 12px 20px}
  .workspace{grid-template-columns:minmax(0,1fr);gap:14px}
  header{margin-bottom:13px}
  .options{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px}
  .option{min-height:46px;padding:6px 8px}
  .preview{width:min(100%,460px);margin-inline:auto}
}
</style>
<script src="palettes.js"></script>
</head>
<body>
<main class="shell">
  <header>
    <div class="wordmark">CASH CLUB</div>
    <h1>手机首页 · 10 套配色</h1>
    <p>选择方案，在同一套首页内容上比较轮播、榜单、快捷入口和底部导航。</p>
  </header>
  <div class="workspace">
    <fieldset>
      <legend>配色系列</legend>
      <div id="options" class="options"></div>
    </fieldset>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-meta"><h2 id="preview-title"></h2>
        <a class="open" id="open-theme" target="_blank" rel="noopener">单独打开首页 ↗</a></div>
      <p id="description"></p>
      <div class="phone"><iframe id="phone-preview" title="CASH CLUB 手机首页预览"></iframe></div>
    </section>
  </div>
</main>
<script>
'use strict';

const choices = window.cashClubPalettes;
const options = document.querySelector('#options');
const phone = document.querySelector('#phone-preview');
const fullPage = document.querySelector('#open-theme');
const paletteTitle = document.querySelector('#preview-title');
const description = document.querySelector('#description');

options.innerHTML = choices.map((palette,index) => {
  const swatches = [palette.colors[0],palette.colors[1],palette.colors[6],palette.colors[7]];
  return `<label class="option"><input type="radio" name="theme" value="${palette.id}">
    <span class="number" aria-hidden="true">${String(index+1).padStart(2,'0')}</span>
    <span><strong>${palette.name}</strong><span class="mini" aria-hidden="true">
      ${swatches.map(color => `<span style="background:${color}"></span>`).join('')}
    </span></span></label>`;
}).join('');

function displayTheme(palette) {
  const number = String(choices.indexOf(palette)+1).padStart(2,'0');
  const page = 'index.html?theme=' + palette.id;
  options.querySelector('input[value="'+palette.id+'"]').checked=true;
  paletteTitle.textContent=number+' · '+palette.name;
  description.textContent=palette.description;
  phone.src=page+'&preview=1';
  phone.title='CASH CLUB 手机首页预览 · '+palette.name;
  fullPage.href=page;
}
function themeFromHash() {
  return choices.find(palette => '#'+palette.id===location.hash) || choices[0];
}
options.addEventListener('change',event => {
  const palette = choices.find(item => item.id===event.target.value);
  if (!palette || themeFromHash()===palette) return;
  location.hash=palette.id;
});
window.addEventListener('hashchange',() => displayTheme(themeFromHash()));
displayTheme(themeFromHash());
</script>
</body>
</html>
