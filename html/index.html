<!DOCTYPE html>
<html lang="zh-CN" data-home-palettes>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="CASH CLUB 平台评级、用户评价、保障条件与积分服务。">
<title>CASH CLUB</title>
<link rel="stylesheet" href="app.css">
<style>
:root{--base:#101216;--surface:#1c2027;--card:#1c2431;--line:#303743;--text:#f5f6f8;--muted:#aeb4bf;--orange:#ff9c43;--gold:#ffbe69}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:360px;background:radial-gradient(ellipse at top,#24201d 0,transparent 67%);pointer-events:none;z-index:-1}
button,input,select{font:inherit}
button,a,select{ -webkit-tap-highlight-color:transparent}
button{border:0;background:none;color:inherit;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,p{margin:0}
svg{width:22px;height:22px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.shell{width:min(100%,760px);margin:auto;padding:0 24px calc(100px + env(safe-area-inset-bottom))}
.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.wordmark{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:850;letter-spacing:.035em}
.wordmark strong{font-weight:850}
.wordmark em{color:var(--orange);font-style:normal}
.mark{width:34px;height:34px;border-radius:10px;color:#25160f;display:grid;place-items:center;background:linear-gradient(145deg,#ffc371,#ff9138);box-shadow:0 3px 13px #ff913832}
.language{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:0 9px;border-radius:9px;min-height:36px;color:var(--muted)}
.language svg{width:16px;height:16px}
.language select{color:var(--text);background:transparent;border:0;font-size:12px;cursor:pointer}
.language option{background:var(--surface)}
.hero{position:relative;isolation:isolate;height:172px;border:1px solid #725035;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 90% 45%,#6a3c21,transparent 64%),linear-gradient(110deg,#251c1a 20%,#38271f 76%,#372719);display:flex;align-items:center;padding:0 25px 14px}
.hero[data-slide="1"]{background:radial-gradient(ellipse at 90% 45%,#68502a,transparent 65%),linear-gradient(110deg,#24201b,#312819)}
.hero[data-slide="2"]{background:radial-gradient(ellipse at 90% 45%,#65412e,transparent 62%),linear-gradient(110deg,#231c22,#32252b)}
.hero-copy{max-width:72%;position:relative;z-index:1}
.hero h1{font-size:clamp(19px,5.5vw,33px);line-height:1.18;letter-spacing:.01em;font-weight:850;color:#fff5e7}
.hero p{font-size:clamp(11px,3vw,14px);color:#e2c6ad;margin-top:7px}
.hero-link{display:inline-flex;align-items:center;gap:4px;color:#291a11;background:var(--gold);border-radius:7px;padding:5px 9px;margin-top:11px;font-size:12px;font-weight:750;min-height:30px}
.hero-link svg,.chevron svg{width:14px;height:14px}
.dots{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;align-items:center}
.dot{width:24px;height:22px;display:grid;place-items:center}
.dot::after{content:"";width:6px;height:6px;border-radius:9px;background:#d1af94}
.dot[aria-current="true"]::after{width:16px;background:var(--orange)}
.notice{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:10px;padding:8px 11px;min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:12px}
.notice .leading,.chevron{color:var(--orange);display:flex;align-items:center;gap:4px}
.notice svg{width:16px;height:16px}
.notice b{flex:none;color:var(--gold)}
.notice .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.quick a{min-width:0;min-height:70px;background:linear-gradient(#20252d,#1b1f26);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;font-size:12px;font-weight:650;padding:6px 2px;line-height:1.25}
.quick a:hover,.platform:hover{border-color:#946137}
.quick .tile-icon{display:grid;place-items:center;width:32px;height:32px;color:var(--gold);background:#ff9c4317;border-radius:9px}
.featured{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px}
.tabs{display:flex;gap:17px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{position:relative;color:var(--muted);font-size:13px;font-weight:650;min-height:38px}
.tabs button[aria-selected="true"]{color:var(--gold)}
.tabs button[aria-selected="true"]::after{content:"";height:2px;background:var(--orange);position:absolute;bottom:-1px;left:0;right:0;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.platform{border:1px solid #414653;border-radius:11px;background:var(--card);position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:14px 4px 9px}
.platform strong{overflow-wrap:anywhere;font-size:12px;line-height:1.2}
.platform img,.detail-logo{display:block;width:44px;height:44px;border-radius:10px;object-fit:cover}
.rating{font-size:12px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.footnote{font-size:11px;color:var(--muted);margin-top:10px}
.bottom{position:fixed;z-index:2;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);padding:4px 8px calc(4px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:13px 13px 0 0;background:#191d24;box-shadow:0 -5px 24px #0d0e1288}
.bottom a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;text-align:center}
.bottom a[aria-current="page"]{color:var(--gold);font-weight:750;background:#ff9c4310;border-radius:9px}
.secondary-head{display:flex;align-items:center;min-height:70px;gap:12px}
.secondary-head h1{font-size:21px}
.back,.close{min-width:38px;min-height:38px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--gold)}
.panel,dialog{border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--surface);color:var(--text)}
.panel h2,dialog h2{font-size:17px;margin-bottom:8px}
.panel p,dialog p{color:var(--muted)}
.panel :is(input,select){display:block;width:100%;border-radius:9px;border:1px solid #414653;background:var(--base);color:var(--text);min-height:42px;padding:9px;margin-top:5px}
.panel label{display:block;margin-bottom:12px}
.panel .grid{margin-top:12px}
.panel .primary,.panel .quiet{margin-top:12px}
.primary,.quiet{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border-radius:9px;padding:8px 12px;font-weight:700}
.primary{background:var(--orange);color:#21160e}
.quiet{background:#292e37;color:var(--text)}
.help-list{display:grid;gap:6px;margin-top:10px}
.help-list a,.help-list button{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px;border-radius:8px;background:#252b34;padding:10px;min-height:42px}
.help-group{margin-top:16px;color:var(--gold);font-size:13px;font-weight:700}
.tutorial{padding-left:22px;color:var(--muted)}
.tutorial li{margin-bottom:8px}
.chat-log{display:grid;gap:8px;max-height:36vh;overflow:auto}
.chat-log p{padding:9px;background:#282e38;border-radius:9px;overflow-wrap:anywhere}
.chat-log .mine{background:#422d21;color:#ffe2c5;margin-left:12%}
.chat-form{display:flex;align-items:end;gap:8px;margin-top:8px}
.chat-form input{flex:1;min-width:0}
.status{margin-top:10px}
dialog{width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:#08090cbd}
dialog .close{float:right}
@media(max-width:560px){
 .shell{padding-inline:12px}
 .top,.secondary-head{min-height:55px;height:55px}
 .hero{height:145px;padding-left:14px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .quick{margin-bottom:12px}
 .featured{padding:10px}
}
@media(max-width:350px){
 .hero-copy{max-width:76%}
 .hero{padding-left:10px}
 .quick a{font-size:11px}
}
</style>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="palettes.css">
<script src="palettes.js"></script>
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="home">
    <section class="hero" id="hero"></section>
    <button class="notice" id="notice" type="button"></button>
    <div class="quick" id="quick" role="group"></div>
    <div class="home-directory">
      <section class="featured" id="featured"></section>
      <aside class="home-guides" id="home-guides"></aside>
    </div>
    <footer class="home-footer" id="home-footer"></footer>
  </main>
  <main id="secondary" hidden></main>
</div>
<nav class="bottom" id="nav"></nav>
<dialog id="announcement"></dialog>
<dialog id="action-dialog"></dialog>
<div id="toast" role="status" hidden></div>

const logos = JSON.parse(document.querySelector('#logos').textContent);
const platforms = logos.map(([name, image], index) => ({
  name, image, score:[4.9,4.8,4.7,4.6,4.5,4.5,4.4,4.3,4.2,4.1][index], index
}));
const $ = selector => document.querySelector(selector);
const navRoutes = ['home','platforms','shop','wheel','account'];
const quickRoutes = ['bind','redeem','help','chat'];
const quickIcons = ['link','coins','help','chat'];

let lang = 'zh';
let slide = 0;
let carouselPaused = new URLSearchParams(location.search).get('preview') === '1';
let tab = 'recommended';
let signedIn = false;
let listQuery = '';
let helpQuery = '';
let chat = [];
const routeScroll = new Map();
const favorites = new Set();
let currentRoute = '';
const t = () => lang === 'zh' ? zh : pt;
const score = platform => platform.score.toLocaleString(lang === 'zh' ? 'zh-CN' : 'pt-BR',{minimumFractionDigits:1});

function renderHero() {
  const copy = t();
  const [title, description, action, destination, help, tutorial] = copy.banners[slide];
  const hero = $('#hero');
  hero.dataset.slide = slide;
  hero.setAttribute('aria-label',copy.carousel);
  hero.setAttribute('aria-roledescription',lang === 'zh' ? '轮播' : 'carrossel');
  const playbackLabel = carouselPaused ? copy.resume : copy.pause;
  hero.innerHTML = `<div class="hero-copy">
    <h1>${title}</h1><p>${description}</p>
    <div class="hero-actions">
      <a class="hero-link" href="#${destination}">${action}${icon('arrow')}</a>
      <a class="hero-secondary" href="#${tutorial}">${help}</a>
    </div>
  </div>
  <div class="hero-controls">
    <div class="dots">${copy.banners.map((item,i) => `<button type="button" class="dot" data-slide="${i}"
      aria-label="${copy.slide} ${i+1}" aria-current="${i===slide}"></button>`).join('')}</div>
    <button type="button" class="carousel-playback" id="carousel-playback" aria-label="${playbackLabel}"
      title="${playbackLabel}">${icon(carouselPaused ? 'play' : 'pause')}</button>
  </div>`;
}

function cards(items, {showRating=true} = {}) {
  return '<div class="grid">' + items.map(platform => {
    const {name,image,index} = platform;
    const rating = showRating ? '<span class="rating">★ ' + score(platform) + '</span>' : '';
    return '<a class="platform" href="#detail/' + index + '"><img src="' + image +
      '" width="44" height="44" alt=""><strong>' + name + '</strong>' + rating + '</a>';
  }).join('') + '</div>';
}

function recommendedList() {
  const labels = t().rankingHeader;
  const header = `<div class="ranking-columns" aria-hidden="true"><span>${labels[0]}</span>
    <span>${labels[1]}</span><span>${labels[2]}</span></div>`;
  return header + '<ol class="top-platforms" role="list">' + platforms.slice(0,10).map((platform,position) => {
    const {index,image,name} = platform;
    const rank = String(position + 1).padStart(2,'0');
    const label = score(platform);
    return '<li><a class="top-platform" href="#detail/' + index + '">' +
      '<span class="top-platform-rank">' + rank + '</span>' +
      '<img src="' + image + '" width="38" height="38" alt=""><strong>' + name + '</strong>' +
      '<span class="top-platform-rating" role="img" aria-label="' + t().ratingLabel + ' ' + label + ' / 5">' +
      '<span class="top-stars" style="--star-fill:' + (platform.score / 5 * 100) + '%" aria-hidden="true">★★★★★</span>' +
      '<span class="top-platform-score" aria-hidden="true">' + label + '</span></span></a></li>';
  }).join('') + '</ol>';
}

function renderFeatured() {
  const copy = t();
  const selected = tab === 'favorites';
  const savedItems = platforms.filter(platform => favorites.has(platform.index));
  const content = selected
    ? (savedItems.length ? cards(savedItems,{showRating:false}) : '<p class="footnote">' + copy.noFavorites + '</p>')
    : recommendedList();
  $('#featured').innerHTML = '<div class="tabs" role="tablist" aria-label="' + copy.platformTabs + '">' +
    ['recommended','favorites'].map(key => '<button id="tab-' + key + '" type="button" role="tab" data-tab="' +
      key + '" aria-controls="platform-panel" aria-selected="' + (tab===key) + '" tabindex="' +
      (tab===key ? 0 : -1) + '">' + copy[key] + '</button>').join('') + '</div>' +
    '<div id="platform-panel" role="tabpanel" aria-labelledby="tab-' + tab + '">' +
    (!selected ? '<p class="ranking-note">' + copy.demo + '</p>' : '') + content + '</div>';
}

function renderHome() {
  const copy = t();
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'pt-BR';
  const brand = `<a class="wordmark" href="#home" aria-label="Cash Club"><span class="mark">${icon('shield')}</span>
    <strong>CASH <em>CLUB</em></strong></a>`;
  $('#top').innerHTML = `${brand}<div class="home-header-tools"><label class="language">${icon('globe')}
    <select id="language" aria-label="${copy.language}"><option value="zh">简体中文</option><option value="pt">Português</option></select></label>
    <a class="home-member" href="#account" aria-label="${copy.memberHome}">${icon('account')}<span>${copy.memberHome}</span></a></div>`;
  $('#language').value = lang;
  $('#notice').innerHTML = '<span class="leading">' + icon('notice') + '</span><b>' + copy.notice +
    '</b><span class="summary">' + copy.headline + '</span><span class="chevron">' + icon('arrow') + '</span>';
  $('#announcement').innerHTML = '<form method="dialog"><button class="close" aria-label="' + copy.close + '">' +
    icon('close') + '</button></form><h2 id="notice-title">' + copy.headline + '</h2><p>' + copy.announcement + '</p>';
  $('#announcement').setAttribute('aria-labelledby','notice-title');
  $('#quick').setAttribute('aria-label',copy.homeServices);
  $('#quick').innerHTML = quickRoutes.map((route,i) => `<a href="#${route}"><span class="tile-icon">${icon(quickIcons[i])}</span>
    <span class="home-quick-label">${copy.quick[i]}</span></a>`).join('');
  $('#home-guides').innerHTML = `<section class="home-guide-list" aria-labelledby="home-guide-title">
    <h2 id="home-guide-title">${copy.guides}</h2>${copy.questions.slice(0,3).map((question,index) =>
      `<a href="#tutorial/${index}"><span class="home-guide-icon">${icon(['link','coins','shield'][index])}</span>
      <span><b>${question}</b><small>${copy.guideNotes[index]}</small></span>${icon('arrow')}</a>`).join('')}
    </section><section class="home-guide-help"><h2>${copy.guideTitle}</h2><p>${copy.guideText}</p>
    <a href="#chat">${icon('chat')}${copy.quick[3]}</a></section>`;
  $('#home-footer').innerHTML = `<div>${brand}<p>${copy.footerText}</p></div>
    <div class="home-footer-links"><a href="#help">${copy.quick[2]}</a>
    <a href="#tutorial/2">${copy.topics[2]}</a><a href="#chat">${copy.quick[3]}</a></div>
    <small>${copy.footerDemo}</small>`;
  renderHero();
  renderFeatured();
}

const findPlatforms = query => platforms.filter(platform => platform.name.toLowerCase().includes(query.trim().toLowerCase()));

function renderList() {
  const items = findPlatforms(listQuery);
  $('#list-results').innerHTML = items.length ? cards(items) : '<p class="status">' + t().noResults + '</p>';
}

function renderHelp() {
  const copy = t();
  const matches = copy.questions.map((question,i) => ({question,i})).filter(({question,i}) =>
    (question + ' ' + copy.topics[i]).toLowerCase().includes(helpQuery.trim().toLowerCase()));
  const questionLink = (question,i) => '<a href="#tutorial/' + i + '">' + question + icon('arrow') + '</a>';
  $('#help-results').innerHTML = matches.length
    ? (helpQuery.trim() ? '' : '<h2 class="help-group">' + copy.common + '</h2><div class="help-list">' +
      copy.questions.slice(0,2).map(questionLink).join('') + '</div>') +
      matches.map(({question,i}) => '<div class="help-group">' + copy.topics[i] + '</div><div class="help-list">' +
        questionLink(question,i) + '</div>').join('')
    : '<p class="status">' + (lang==='zh'?'未找到匹配的问题':'Nenhuma dúvida encontrada') + '</p>';
}

function renderChat() {
  const log = $('#chat-log');
  const copy = t();
  log.replaceChildren();
  for (const [message, mine] of [[copy.greeting,false],...chat]) {
    const bubble = document.createElement('p');
    bubble.textContent = message;
    if (mine) bubble.className = 'mine';
    log.append(bubble);
  }
  log.scrollTop = log.scrollHeight;
}
